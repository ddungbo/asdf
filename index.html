<style>

<body>
<div class="topbar">금융위원회 기업 재무정보 · 공공데이터포털 API</div>

<header>
  <div class="head-in">
    <div class="head-row">
      <div class="logo" id="logo">CORP<span>.</span>FINDER</div>
      <form id="form">
        <input type="text" id="q" placeholder="회사명 또는 법인등록번호 13자리" autocomplete="off" autofocus />

      </form>

    <div class="opt">
      <label><input type="checkbox" id="autoTier" checked /> 검색 결과를 규모 단계로 자동 분류 (후보 1곳당 API 1~2건 추가 사용)</label>
    </div>
  </div>
</header>

<main id="result"></main>

<footer>
  본 서비스는 공공데이터포털(금융위원회) 데이터를 활용하며, 정보의 정확성을 보장하지 않습니다.<br>

<script>
/* ================= 설정 ================= */
const SERVICE_KEY = "c96b9868b0a4746d0488f6ce390f004e89e8438422579021c39c0e765310f0f1";
const BASE = "https://apis.data.go.kr/1160100/service";
const OUTLINE_URL = `${BASE}/GetCorpBasicInfoService_V2/getCorpOutline_V2`;
const FINA_URL    = `${BASE}/GetFinaStatInfoService_V2/getSummFinaStat_V2`;
const YEARS = 5;
const TIMEOUT_MS = 12000;
const TIER_CONCURRENCY = 4;

const TIERS = [
  { id: "t1", label: "1단계 초대형", desc: "총자산 5조 이상", min: 5e12 },
  { id: "t2", label: "2단계 대형",   desc: "5천억 ~ 5조",     min: 5e11 },
  { id: "t3", label: "3단계 중형",   desc: "500억 ~ 5천억",   min: 5e10 },
  { id: "t4", label: "4단계 소형",   desc: "500억 미만",      min: -Infinity },
];
const UNKNOWN = { id: "unk", label: "미확인", desc: "재무 데이터 없음" };
const tierOf = (a) => a == null ? UNKNOWN : TIERS.find((t) => a >= t.min);
const tierById = (id) => id === UNKNOWN.id ? UNKNOWN : TIERS.find((t) => t.id === id);

const KEYWORDS = ["메리츠자산운용", "삼성전자", "현대자동차", "1746110000741"];

/* 로컬 프록시(server.py) 우선 → 직접 호출 → 외부 중계 서버 */
const PROXIES = [
  { name: "로컬 프록시",    make: (u) => `/proxy?url=${encodeURIComponent(u)}` },
  { name: "직접 호출",      make: (u) => u },
  { name: "corsproxy.io",   make: (u) => `https://corsproxy.io/?url=${encodeURIComponent(u)}` },
  { name: "allorigins.win", make: (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}` },
];

/* ================= 유틸 ================= */
const $ = (id) => document.getElementById(id);
const form = $("form"), q = $("q"), btn = $("btn"), result = $("result"), autoTier = $("autoTier");

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
}[c]));
const fmtCrno = (n = "") => (n.length === 13 ? `${n.slice(0, 6)}-${n.slice(6)}` : n);

function fmtWon(v) {
  if (v === undefined || v === null || v === "") return null;
  const n = Number(v);
  if (Number.isNaN(n)) return null;
  const sign = n < 0 ? "-" : "";
  const eok = Math.round(Math.abs(n) / 1e8);
  if (eok >= 10000) {
    const jo = Math.floor(eok / 10000), rest = eok % 10000;
    return `${sign}${jo.toLocaleString()}조${rest ? ` ${rest.toLocaleString()}억` : ""}`;
  }
  if (eok === 0 && n !== 0) return `${sign}${Math.round(Math.abs(n) / 1e4).toLocaleString()}만`;
  return `${sign}${eok.toLocaleString()}억`;
}
const fmtPct = (v) => (v === undefined || v === null || v === "" || isNaN(Number(v)) ? null : `${Number(v).toFixed(1)}%`);

const ROWS = [
  ["enpSaleAmt",  "매출액",     fmtWon],
  ["enpBzopPft",  "영업이익",   fmtWon],
  ["enpCrtmNpf",  "당기순이익", fmtWon],
  ["enpTastAmt",  "총자산",     fmtWon],
  ["enpTdbtAmt",  "총부채",     fmtWon],
  ["enpTcptAmt",  "총자본",     fmtWon],
  ["enpCptlAmt",  "자본금",     fmtWon],
  ["fnclDebtRto", "부채비율",   fmtPct],
];
const KPIS = [["enpSaleAmt", "매출액"], ["enpBzopPft", "영업이익"], ["enpTastAmt", "총자산"]];

function dedupe(arr, keyFn) {
  const map = new Map();
  for (const it of arr) {
    const k = keyFn(it), old = map.get(k);
    if (!old || String(it.basDt ?? "") > String(old.basDt ?? "")) map.set(k, it);
  }
  return [...map.values()];
}

async function runPool(tasks, limit) {
  let i = 0;
  const worker = async () => { while (i < tasks.length) { const t = tasks[i++]; await t(); } };
  await Promise.all(Array.from({ length: Math.min(limit, tasks.length) }, worker));
}

/* ================= 에러 / 상태 ================= */
class AppError extends Error {
  constructor(title, causes = [], detail = "") { super(title); this.title = title; this.causes = causes; this.detail = detail; }
}
function showError(e) {
  const title = e.title || e.message || "알 수 없는 오류";
  const causes = e.causes || [];
  result.innerHTML = `
    <div class="err">
      <b>${esc(title)}</b>
      ${causes.length ? `<ul>${causes.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}
      ${e.detail ? `<details open><summary>상세 정보</summary><pre>${esc(e.detail)}</pre></details>` : ""}
    </div>`;
}

let busy = false;
function setBusy(on, text = "") {
  busy = on;
  btn.disabled = on;
  btn.textContent = on ? "검색 중" : "검색";
  if (on) result.innerHTML = `<div class="msg"><div class="spin"></div>${esc(text)}</div>`;
}
const idle = () => { busy = false; btn.disabled = false; btn.textContent = "검색"; };

/* ================= 네트워크 ================= */
async function timedFetch(url) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try { return await fetch(url, { signal: ctrl.signal }); }
  finally { clearTimeout(t); }
}

const route = { via: null };
async function fetchText(url) {
  const attempts = [];
  const order = [...PROXIES];
  if (route.via) order.sort((a, b) => (a.name === route.via ? -1 : b.name === route.via ? 1 : 0));

  for (const p of order) {
    try {
      const res = await timedFetch(p.make(url));
      const text = await res.text();
      if (!text.trim()) throw new Error("빈 응답");
      if (!/resultCode|returnReasonCode|returnAuthMsg|errMsg/.test(text))
        throw new Error(`API 응답이 아님 (HTTP ${res.status})`);
      route.via = p.name;
      return { text, via: p.name, status: res.status };
    } catch (e) {
      attempts.push(`${p.name}: ${e.name === "AbortError" ? "시간 초과" : e.message}`);
    }
  }
  throw new AppError("API 서버에 연결하지 못했습니다", [
    "터미널에서 python server.py 를 실행했는지, 주소가 http://localhost:8000/ 로 시작하는지 확인하세요.",
    "파일을 더블클릭(file://)으로 열면 로컬 프록시를 쓸 수 없습니다.",
    "광고 차단 확장 프로그램, 방화벽, VPN이 막고 있을 수 있습니다.",
  ], attempts.join("\n"));
}

const cache = new Map();
function callApi(baseUrl, params) {
  const key = baseUrl + JSON.stringify(params);
  if (cache.has(key)) return cache.get(key);
  const p = doCall(baseUrl, params).catch((e) => { cache.delete(key); throw e; });
  cache.set(key, p);
  return p;
}

async function doCall(baseUrl, params) {
  const qs = new URLSearchParams({ serviceKey: SERVICE_KEY, resultType: "json", pageNo: "1", ...params });
  const { text, via, status } = await fetchText(`${baseUrl}?${qs}`);

  let data = null;
  try { data = JSON.parse(text); } catch {}

  if (!data) {
    const m = text.match(/<returnAuthMsg>(.*?)<\/returnAuthMsg>/) || text.match(/<errMsg>(.*?)<\/errMsg>/);
    const code = (text.match(/<returnReasonCode>(.*?)<\/returnReasonCode>/) || [])[1];
    const hints = [];
    if (m && /NOT_REGISTERED|SERVICE_KEY/i.test(m[1])) {
      hints.push("인증키가 틀렸거나 발급 직후라 아직 반영되지 않았습니다(최대 1~2시간).",
                 "포털 마이페이지에서 해당 API 활용신청이 '승인' 상태인지 확인하세요.",
                 "Decoding(일반) 인증키를 써야 합니다.");
    } else if (m && /LIMITED/i.test(m[1])) {
      hints.push("오늘 사용 가능한 트래픽을 모두 썼습니다. 내일 다시 시도하세요.");
    } else {
      hints.push("상세 정보의 응답 원문을 확인하세요.");
    }
    throw new AppError(`API 오류${code ? ` (코드 ${code})` : ""}: ${m ? m[1] : "JSON이 아닌 응답"}`, hints,
      `경로: ${via}\nHTTP ${status}\n\n${text.slice(0, 800)}`);
  }

  const header = data?.response?.header ?? data;
  const rc = header?.resultCode;
  if (rc === "03") return { totalCount: 0, items: [], via };
  if (rc !== "00") {
    const map = {
      "10": "요청 변수가 올바르지 않습니다.",
      "12": "서비스 주소 또는 상세기능 이름이 올바르지 않습니다.",
      "20": "이 API 활용신청이 승인되지 않았습니다.",
      "22": "일일 트래픽을 초과했습니다.",
      "30": "등록되지 않은 인증키입니다.",
      "31": "인증키 활용 기간이 만료되었습니다.",
    };
    throw new AppError(`API 오류 (코드 ${rc ?? "?"}): ${header?.resultMsg ?? "알 수 없음"}`,
      map[rc] ? [map[rc]] : [], `경로: ${via}\n\n${text.slice(0, 800)}`);
  }

  const body = data.response.body;
  let items = body?.items?.item ?? [];
  if (!Array.isArray(items)) items = [items];
  return { totalCount: Number(body?.totalCount ?? items.length), items, via };
}

/* ================= 재무 데이터 ================= */
async function fetchFinRows(crno, years) {
  const settled = await Promise.allSettled(
    years.map((y) => callApi(FINA_URL, { numOfRows: "10", crno, bizYear: String(y) }))
  );
  const failed = settled.filter((s) => s.status === "rejected");
  if (failed.length === settled.length) throw failed[0].reason;

  const all = [];
  let via = "";
  settled.forEach((s, idx) => {
    if (s.status !== "fulfilled") return;
    via = s.value.via;
    for (const i of s.value.items) {
      all.push({ ...i, _year: years[idx], _kind: i.fnclDcd ?? "-", _kindNm: i.fnclDcdNm || i.fnclDcd || "재무제표" });
    }
  });

  const rows = dedupe(all, (r) => `${r._year}|${r._kind}`);
  const warnings = [...new Set(failed.map((f) => f.reason.title || f.reason.message))];
  return { rows, warnings, via };
}

async function latestAsset(crno) {
  const y = new Date().getFullYear();
  for (const year of [y - 1, y - 2]) {
    const { items } = await callApi(FINA_URL, { numOfRows: "10", crno, bizYear: String(year) });
    const assets = dedupe(items, (r) => r.fnclDcd ?? "-")
      .map((r) => Number(r.enpTastAmt)).filter((n) => Number.isFinite(n));
    if (assets.length) return Math.max(...assets);
  }
  return null;
}

    return;
  }

           via: res.via, tiers: {}, filter: "all", done: 0, total: 0, name };

async function classify(token) {
  const my = list;
  const targets = my.items.map((i) => i.crno);
  my.total = targets.length; my.done = 0;
  drawList();
  await runPool(targets.map((crno) => async () => {
    if (token !== listToken) return;
    try { const a = await latestAsset(crno); my.tiers[crno] = tierOf(a).id; }
    catch { my.tiers[crno] = UNKNOWN.id; }
    my.done++;
    if (token === listToken) drawList();
  }), TIER_CONCURRENCY);
}

function drawList() {
  if (!list || view !== "list") return;
  const tierId = (crno) => list.tiers[crno] ?? null;
  const counts = { all: list.items.length };
  [...TIERS, UNKNOWN].forEach((t) => (counts[t.id] = 0));
  list.items.forEach((i) => { const t = tierId(i.crno); if (t) counts[t]++; });

  const shown = list.items.filter((i) => list.filter === "all" || tierId(i.crno) === list.filter);
  const hasTiers = list.total > 0;
  const classifying = hasTiers && list.done < list.total;

  const chips = hasTiers ? `
    <div class="chips">
      ${[{ id: "all", label: "전체" }, ...TIERS, UNKNOWN].map((t) => `
        <button type="button" class="chip ${list.filter === t.id ? "on" : ""}" data-tier="${t.id}" title="${esc(t.desc || "")}">
          ${esc(t.label)}<small>${counts[t.id]}</small>
        </button>`).join("")}
    </div>
    ${classifying ? `<div class="progress">규모 분류 중 ${list.done}/${list.total}</div>
      <div class="bar"><i style="width:${Math.round(list.done / list.total * 100)}%"></i></div>` : ""}` : "";

  const tag = (crno) => {
    if (!hasTiers) return "";
    const id = tierId(crno);
    if (!id) return `<span class="tag">분류 중</span>`;
    const t = tierById(id);
    return `<span class="tag ${t.id}">${esc(t.label)}</span>`;
  };

  result.innerHTML = `
    <div class="list-head">
      <h2>"${esc(list.name)}" 검색결과 <em>${shown.length}</em></h2>
      <small>총 ${esc(list.totalCount)}건 · 중복 ${list.removed}건 제거 · 경로: ${esc(list.via)}</small>
    </div>
    ${chips}
    ${shown.length ? `<div class="grid">${shown.map((i) => `
      <article class="card" tabindex="0" data-crno="${esc(i.crno)}" data-name="${esc(i.corpNm)}">
        <div class="thumb">${esc(String(i.corpNm || "?").replace(/^\(?주\)?\s*|^주식회사\s*/, "").charAt(0) || "?")}${tag(i.crno)}</div>
        <div class="nm">${esc(i.corpNm)}</div>
        <div class="sub">대표 ${esc(i.enpRprFnm) || "-"}<br>${esc(i.enpBsadr) || ""}</div>
        <div class="no">${esc(fmtCrno(i.crno))}</div>
      </article>`).join("")}</div>` : `<div class="msg">이 단계에 해당하는 기업이 없습니다.</div>`}`;
}

async function loadFin(crno, name, fromList) {
  const token = ++viewToken;
  view = "detail";
  if (!fromList) { list = null; listToken++; }
  setBusy(true, `최근 ${YEARS}개년 재무제표를 불러오는 중…`);

  const thisYear = new Date().getFullYear();
  const years = Array.from({ length: YEARS }, (_, k) => thisYear - 1 - k);

  const namePromise = name ? Promise.resolve(name)
    : callApi(OUTLINE_URL, { numOfRows: "1", crno })
        .then((r) => r.items[0]?.corpNm || "").catch(() => "");

  const [{ rows, warnings, via }, finalName] =
    await Promise.all([fetchFinRows(crno, years), namePromise]);
  if (token !== viewToken) return;
  name = finalName;

  if (!rows.length) {
    result.innerHTML = `
      <button type="button" class="back">← ${fromList && list ? "검색 결과로" : "처음으로"}</button>
      <div class="msg">법인등록번호 ${esc(fmtCrno(crno))} 의 재무제표 데이터가 없습니다.<br>
      금융위원회에 재무정보가 등록되지 않은 기업일 수 있습니다. (외부감사 대상 기업 위주)</div>`;
    return;
  }
  renderFin({ crno, name, rows, via, warnings, fromList });
}

function renderFin({ crno, name, rows, via, warnings, fromList }) {
  const kinds = [...new Map(rows.map((r) => [r._kind, r._kindNm])).entries()];
  let current = kinds[0][0];

  const latestYear = Math.max(...rows.map((r) => r._year));
  const assets = rows.filter((r) => r._year === latestYear).map((r) => Number(r.enpTastAmt)).filter(Number.isFinite);
  const tier = tierOf(assets.length ? Math.max(...assets) : null);
    const raw = rows[0];

  const draw = () => {
    const cur = rows.filter((r) => r._kind === current);
    const years = [...new Set(cur.map((r) => r._year))].sort((a, b) => a - b);
    const byYear = Object.fromEntries(cur.map((r) => [r._year, r]));
    const last = byYear[years[years.length - 1]] || {};

    $("kpis").innerHTML = KPIS.map(([key, label]) => {
      const txt = fmtWon(last[key]);
      return `<div class="kpi"><div class="k">${years[years.length - 1]}년 ${label}</div>
        <div class="v ${Number(last[key]) < 0 ? "neg" : ""}">${txt === null ? "-" : esc(txt)}</div></div>`;
    }).join("");

    const head = `<tr><th>항목</th>${years.map((y) => `<th>${y}</th>`).join("")}</tr>`;
    const body = ROWS.map(([key, label, fmt]) => {
      const tds = years.map((y) => {
        const v = byYear[y]?.[key];
        const txt = fmt(v);
        if (txt === null) return `<td class="na">-</td>`;
        const tip = key === "fnclDebtRto" ? "" : ` title="${esc(Number(v).toLocaleString())}원"`;
        return `<td class="${Number(v) < 0 ? "neg" : ""}"${tip}>${esc(txt)}</td>`;
      }).join("");
      return `<tr><td>${label}</td>${tds}</tr>`;
    }).join("");

    $("tbl").innerHTML = `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
    document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.k === current));
  };

  result.innerHTML = `
    <button type="button" class="back">← ${fromList && list ? "검색 결과로" : "처음으로"}</button>
    <div class="d-top">
      <div>
        <span class="lbl ${tier.id}">${esc(tier.label)}</span>
        <h2>${esc(name || "재무제표")}</h2>
        <div class="no">${esc(fmtCrno(crno))}</div>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="tabs">
      ${kinds.map(([k, n]) => `<button type="button" class="tab" data-k="${esc(k)}">${esc(n)}</button>`).join("")}
    </div>
    <div class="scroll" id="tbl"></div>
    <div class="note">
      금액은 억 원 단위로 반올림해 표시했습니다. 숫자에 마우스를 올리면 원 단위 값이 보입니다.<br>
      규모 단계는 ${latestYear}년 총자산 기준입니다 (${esc(tier.desc)}). 데이터 수신 경로: ${esc(via)}
    </div>
    ${warnings.length ? `<div class="warn">일부 연도는 조회되지 않았습니다:\n${esc(warnings.join("\n"))}</div>` : ""}
    <details>
      <summary>원본 응답 1건 보기 (표가 '-'로만 나올 때 필드명 확인용)</summary>
      <pre>${esc(JSON.stringify(raw, null, 2))}</pre>
    </details>`;

  result.querySelectorAll(".tab").forEach((t) =>
    t.addEventListener("click", () => { current = t.dataset.k; draw(); })
  );
  draw();
  window.scrollTo({ top: 0 });
}

        email: cs.email,
        phone,
        purpose: csLabel(cs.purpose),
        message: `상담 목적: ${csLabel(cs.purpose)}\n연락처: ${phone}\n이메일: ${cs.email}`,
        botcheck: "",
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.success) throw new Error(data.message || `HTTP ${res.status}`);
    cs.step = 3;
  } catch (e) {
    cs.error = `전송에 실패했습니다. 잠시 후 다시 시도해 주세요. (${e.message})`;
  }
  cs.sending = false;
  csRender();
}

csBody.addEventListener("click", (e) => {
  if (cs.sending) return;
  const t = e.target.closest("[data-p], [data-act]");
  if (!t) return;
  csSave();

  if (t.dataset.p) { cs.purpose = t.dataset.p; cs.step = 1; cs.error = ""; return csRender(); }

  switch (t.dataset.act) {
    case "back": cs.step = Math.max(0, cs.step - 1); cs.error = ""; return csRender();
    case "skip": cs.phone = ""; cs.step = 2; cs.error = ""; return csRender();
    case "next":
      if (cs.phone && !csPhoneOk(cs.phone)) { cs.error = "전화번호 형식이 올바르지 않습니다."; return csRender(); }
      cs.step = 2; cs.error = ""; return csRender();
    case "send":
      if (!csEmailOk(cs.email)) { cs.error = "이메일 주소를 올바르게 입력해 주세요."; return csRender(); }
      if (!cs.agree)            { cs.error = "개인정보 수집·이용에 동의해 주세요."; return csRender(); }
      return csSend();
    case "close": return csClose();
  }
});

csBody.addEventListener("input", (e) => {
  if (e.target.id === "csPhone") e.target.value = csFmtPhone(e.target.value);
});
csBody.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || !e.target.matches("input[type=tel], input[type=email]")) return;
  e.preventDefault();
  csBody.querySelector('[data-act="next"], [data-act="send"]')?.click();
});

$("csOpenBtn").addEventListener("click", csOpen);
$("csCloseBtn").addEventListener("click", csClose);
csOverlay.addEventListener("click", (e) => { if (e.target === csOverlay) csClose(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !csOverlay.hidden) csClose(); });

/* 예상치 못한 오류도 화면에 표시 */
window.addEventListener("error", (e) => showError(new AppError("자바스크립트 오류", [e.message], `${e.filename}:${e.lineno}`)));
window.addEventListener("unhandledrejection", (e) => showError(e.reason instanceof AppError ? e.reason : new AppError("처리되지 않은 오류", [String(e.reason?.message || e.reason)])));

showHome();
</script>
</body>
</html>
